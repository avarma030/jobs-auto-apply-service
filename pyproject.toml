[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jobs-auto-apply-service"
version = "0.1.0"
description = "Automated job scraping and application service across multiple job boards"
requires-python = ">=3.11"
dependencies = [
    # Browser automation
    "playwright>=1.44.0",
    "selenium>=4.21.0",
    "webdriver-manager>=4.0.1",
    # HTTP / scraping
    "curl-cffi>=0.7.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "scrapy>=2.11.2",
    # Data / models
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    # Task queue / scheduling
    "apscheduler>=3.10.4",
    "celery>=5.4.0",
    "redis>=5.0.4",
    # PDF / resume parsing
    "pymupdf>=1.24.4",
    "python-docx>=1.1.2",
    # Web API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0.0",
    "asyncpg>=0.29.0",
    # AI / Claude
    "anthropic>=0.28.0",
    # PDF generation for tailored resumes
    "reportlab>=4.0.0",
    # Excel export
    "openpyxl>=3.1.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "loguru>=0.7.2",
    "rich>=13.7.1",
    "click>=8.1.7",
    "tqdm>=4.66.4",
    "fake-useragent>=1.5.1",
    "python-slugify>=8.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[project.scripts]
jobs-apply = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
